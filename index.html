<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spesa di Casa</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spesa">
<meta name="theme-color" content="#2f6b4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: una colonna, lista in alto, comandi in basso a portata di pollice */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --fg:#17231d; --muted:#5e6f66; --line:#dbe3de;
  --accent:#2f6b4a; --accent-fg:#ffffff; --accent-soft:#e1efe6;
  --danger:#b3412f; --danger-soft:#f8e4df; --warn-soft:#fff3d6; --star:#c98a10;
  --display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#1a231e; --fg:#e7eee9; --muted:#97a89e; --line:#2b3730;
  --accent:#7cc79c; --accent-fg:#0d1a12; --accent-soft:#1f3328;
  --danger:#ef8a77; --danger-soft:#3a201b; --warn-soft:#3a3218; --star:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#1a231e; --fg:#e7eee9; --muted:#97a89e; --line:#2b3730;
  --accent:#7cc79c; --accent-fg:#0d1a12; --accent-soft:#1f3328;
  --danger:#ef8a77; --danger-soft:#3a201b; --warn-soft:#3a3218; --star:#f2c14e; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.proto{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-block:4px 12px}
.proto button{background:none;border:0;padding:0;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600}

/* accesso */
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding-block:24px}
.gate h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;margin:0;text-wrap:balance}
.gate p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field input,.sheet select{height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px;width:100%}
.field input:focus,.sheet select:focus{border-color:var(--accent);outline:none}
.primary{height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:17px;width:100%}
.primary:disabled{opacity:.5}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px}

/* lista */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 16px}
header.top h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;margin:0}
header.top h1{font-size:30px;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.who{flex:none;white-space:nowrap}
.trip-h .store{font-weight:500;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.list-btn{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;display:inline;cursor:pointer}
.list-btn svg{width:24px;height:24px;vertical-align:-3px;margin-left:4px;color:var(--accent)}
.list-pick{display:flex;align-items:center;justify-content:space-between;gap:12px;height:auto;min-height:60px;padding-block:8px}
.list-pick svg{width:22px;height:22px;flex:none;color:var(--accent)}
.list-pick[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.who{font-size:14px;color:var(--muted);text-align:right}
.who button{background:none;border:0;padding:0;color:var(--accent);font-size:14px;font-weight:600}
.count{display:inline-flex;align-items:baseline;gap:6px;margin-top:6px;font-size:15px;color:var(--muted)}
.count b{font-family:var(--display);font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.section{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 4px 8px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.item{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:64px}
.tap{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;text-align:left;padding:10px 4px 10px 14px;min-height:64px}
.box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.done .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:16px;height:16px;stroke:var(--accent-fg);opacity:0}
.done .box svg{opacity:1}
.txt{min-width:0;display:flex;flex-direction:column}
.name{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.done .name{text-decoration:line-through;color:var(--muted)}
.meta{font-size:13px;color:var(--muted)}
.qty{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}
.done .qty{color:var(--muted)}
.del{flex:none;width:52px;height:64px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.del svg{width:20px;height:20px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted);text-align:center}
li.pending{opacity:.55}

/* barra in basso */
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-inner{max-width:520px;margin:0 auto;display:flex;gap:10px}
.bar .primary{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(20,50,35,.18)}
.done-btn{flex:1;height:54px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:800;font-size:15px;letter-spacing:.05em;font-variant-numeric:tabular-nums;box-shadow:0 6px 18px rgba(20,50,35,.12)}
.done-btn:disabled{border-color:var(--line);color:var(--muted);box-shadow:none}

/* schede Lista / Cronologia */
.tabs{display:flex;gap:4px;background:var(--accent-soft);border-radius:12px;padding:4px}
.tabs button{flex:1;height:40px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* foto */
.thumb{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--line)}
.done .thumb{opacity:.6}
.photo-pick{display:flex;align-items:center;gap:12px}
.photo-pick .thumb{width:56px;height:56px}
.soft{height:44px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;padding:0 14px;display:inline-flex;align-items:center;gap:8px}
.soft svg{width:18px;height:18px}
.linkish{background:none;border:0;color:var(--muted);font-weight:600;padding:8px 4px;font-size:14px}

/* menu articolo e conferma */
.menu-btn{height:52px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--fg);font-weight:600;text-align:left;padding:0 16px;width:100%}
.menu-btn.danger{background:var(--danger-soft);color:var(--danger)}
.confirm-list{margin:0;padding:12px 14px;background:var(--bg);border-radius:12px;color:var(--muted);font-size:15px;max-height:30vh;overflow:auto}

/* cronologia */
.search{position:relative;margin-top:16px}
.search input{height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px 0 42px;font-size:17px;width:100%}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:14px;top:16px;width:20px;height:20px;stroke:var(--muted)}
.trip-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 4px 8px}
.trip-h .when{font-weight:600;font-size:15px}
.trip-h .n{font-size:13px;color:var(--muted);flex:none}
li.hist{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:64px;padding:10px 14px}
mark{background:var(--warn-soft);color:inherit;border-radius:3px}
.rate{color:var(--star);font-weight:600;white-space:nowrap}
.stars{display:flex;gap:2px}
.star{width:48px;height:48px;border:0;background:none;padding:6px;color:var(--line)}
.star.on{color:var(--star)}
.star svg{width:100%;height:100%;fill:currentColor}
.mini-stars{color:var(--star);letter-spacing:1px}
.votes{display:flex;flex-direction:column;gap:6px;margin:0;padding:12px 14px;background:var(--bg);border-radius:12px;list-style:none}
.votes li{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.label{font-weight:600;font-size:14px}
.sheet-scroll{max-height:calc(100vh - 80px);overflow:auto}
.del.added{color:var(--accent)}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{display:flex;align-items:center;gap:10px;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:6px 12px;text-align:left;width:100%}
.sugg .thumb{width:36px;height:36px;border-radius:8px}

/* foglio aggiungi */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet form{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--display);font-size:22px;margin:0}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.stepper{display:flex;align-items:center;height:52px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:48px;height:100%;border:0;background:var(--accent-soft);color:var(--accent);font-size:22px;font-weight:600}
.stepper input{flex:1;min-width:0;border:0;background:none;text-align:center;font-size:17px;font-variant-numeric:tabular-nums;height:100%}
.ghost{height:46px;border:0;background:none;color:var(--muted);font-weight:600}

/* avvisi */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;
  width:min(488px,calc(100% - 32px));background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:15px}
.toast.bad{background:var(--danger);color:#fff}
.toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
[hidden]{display:none!important}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30%);opacity:.4}}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="gate"><p>Caricamento…</p></div></div>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="filePick" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
<script>
// ===== Collegamento al database =====
// La "publishable key" è pubblica per natura: i dati sono protetti dalle regole RLS nel database.
// NON inserire mai qui la secret key o la password del database.
const SUPABASE_URL = 'https://mgdvmuqbwrizcdgraklo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GoZ7XDZLCzdv5vS8WU0q3A_yhqEDaWt';
const EMAIL_DOMAIN = '@spesa.local';
const BUCKET = 'foto';

const S = {
  screen:'loading', me:null, user:'', displayName:'',
  items:[], history:[], ratings:[], urls:{}, urlsAt:0,
  tab:'list', q:'', sheet:null, menuId:null, histRef:null, renameRef:null,
  lists:[], listId:null, draftPhoto:null, finishing:false, pending:new Set(), pendingVal:{}
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtQty = q => String(q).replace('.',',');
const UNITS = {'':'—',pz:'pezzi',conf:'confezioni',kg:'kg',g:'g',l:'litri'};
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const fmtWhen = ms => { const d=new Date(ms);
  const day=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return day.charAt(0).toUpperCase()+day.slice(1)+' · ore '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); };

const NET_ERR='Non riesco a salvare: controlla la connessione e riprova.';

let db=null;
try{ db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}}); }catch(e){}

// esegue una chiamata al database e trasforma l'errore in eccezione
async function q(promise){ const r=await promise; if(r.error) throw r.error; return r.data; }

// ===== voti e prodotti =====
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
const avgVals = v => v.length?{avg:v.reduce((a,b)=>a+b,0)/v.length,n:v.length}:null;
const ratingRows = name => { const k=norm(name); return S.ratings.filter(r=>r.product_key===k); };
const productAvg = name => avgVals(ratingRows(name).map(r=>r.stars));
const timesBought = name => { const k=norm(name); let n=0; S.history.forEach(t=>t.items.forEach(i=>{ if(norm(i.name)===k) n++ })); return n; };
const rateHTML = a => a?` · <span class="rate">★ ${a.avg.toFixed(1).replace('.',',')}${a.n>1?` <span style="font-weight:400">(${a.n} voti)</span>`:''}</span>`:'';
const timesTxt = n => n===1?'comprato 1 volta':'comprato '+n+' volte';
const prodInfoHTML = name => { const n=timesBought(name); return rateHTML(productAvg(name))+(n?' · <span style="white-space:nowrap">'+timesTxt(n)+'</span>':''); };
const miniStars = n => '★'.repeat(n)+'<span style="color:var(--line)">'+'★'.repeat(5-n)+'</span>';
function pastProducts(){
  const m=new Map();
  [...S.history].sort((a,b)=>b.at-a.at).forEach(t=>t.items.forEach(i=>{ const k=norm(i.name); if(!m.has(k)) m.set(k,{...i,at:t.at}); }));
  return [...m.values()];
}
const inList = name => S.items.some(i=>!i.done && norm(i.name)===norm(name));

// ===== avvisi =====
let toastTimer;
function toast(msg,{bad=false,action,onAction}={}){
  const t=$('#toast'); clearTimeout(toastTimer);
  t.className='toast'+(bad?' bad':'')+(document.querySelector('.sheet')?' top':'');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<button type="button" id="tAct">'+esc(action)+'</button>':'');
  t.hidden=false;
  if(action) $('#tAct').onclick=()=>{t.hidden=true;onAction()};
  toastTimer=setTimeout(()=>t.hidden=true, action?5000:3000);
}

// ===== foto =====
function compress(file){
  return new Promise((ok,ko)=>{
    const r=new FileReader(); r.onerror=ko;
    r.onload=()=>{ const img=new Image(); img.onerror=()=>ko(new Error('img'));
      img.onload=()=>{ const s=Math.min(1,800/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg',.75)); };
      img.src=r.result; };
    r.readAsDataURL(file);
  });
}
let onPhoto=null;
$('#filePick').onchange=async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f||!onPhoto) return;
  try{ const data=await compress(f); onPhoto(data); }
  catch{ toast('Non riesco a leggere questa immagine. Prova con un’altra foto.',{bad:true}); }
};
function pickPhoto(cb){ onPhoto=cb; $('#filePick').click(); }
// carica la foto nella cartella privata e restituisce il suo percorso
async function uploadPhoto(dataUrl){
  const blob=await (await fetch(dataUrl)).blob();
  const path=S.listId+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+'.jpg';
  await q(db.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false}));
  S.urls[path]=dataUrl;
  return path;
}
// le foto sono private: chiedo al database dei link temporanei (validi 1 ora)
async function refreshPhotoUrls(){
  if(Date.now()-S.urlsAt>45*60*1000){ S.urls={}; S.urlsAt=Date.now(); }
  const paths=new Set();
  S.items.forEach(i=>i.photo&&paths.add(i.photo));
  S.history.forEach(t=>t.items.forEach(i=>i.photo&&paths.add(i.photo)));
  const missing=[...paths].filter(p=>!S.urls[p]);
  if(!missing.length) return false;
  try{
    const data=await q(db.storage.from(BUCKET).createSignedUrls(missing,3600));
    (data||[]).forEach(d=>{ if(d.signedUrl) S.urls[d.path]=d.signedUrl; });
    return true;
  }catch{ return false; }
}
const photoSrc = p => p&&S.urls[p]||'';
const thumbHTML = it => it.photo?`<img class="thumb" src="${esc(photoSrc(it.photo))}" alt="">`:'';

// ===== caricamento dati =====
let loadSeq=0;
async function loadAll(){
  const my=++loadSeq;
  if(!S.listId) return;
  const [items,trips,purchases,ratings]=await Promise.all([
    q(db.from('items').select('*').eq('list_id',S.listId)),
    q(db.from('trips').select('*').eq('list_id',S.listId)),
    q(db.from('purchases').select('*').eq('list_id',S.listId)),
    q(db.from('ratings').select('*').eq('list_id',S.listId))
  ]);
  if(my!==loadSeq) return;                       // nel frattempo è cambiata lista o è arrivato un caricamento più recente                       // è arrivato un caricamento più recente
  S.items=items.map(r=>({id:r.id,name:r.name,qty:Number(r.qty),unit:r.unit||'',by:r.by_name,done:r.done,t:Date.parse(r.created_at),photo:r.photo_path}));
  const byTrip=new Map(trips.map(t=>[t.id,{id:t.id,at:Date.parse(t.done_at),store:t.store||'',items:[]}]));
  purchases.forEach(p=>{ const t=byTrip.get(p.trip_id); if(t) t.items.push({id:p.id,name:p.name,qty:Number(p.qty),unit:p.unit||'',by:p.by_name,photo:p.photo_path}); });
  S.history=[...byTrip.values()].filter(t=>t.items.length);
  S.history.forEach(t=>t.items.sort((a,b)=>a.id-b.id));
  S.ratings=ratings;
  S.pending.forEach(id=>{ const it=S.items.find(i=>i.id===id); if(it) it.done=S.pendingVal[id]; }); // tocchi ancora in volo
  if(await refreshPhotoUrls()) {}
}
// aggiorna lo schermo senza interrompere chi sta scrivendo
function refreshView(){
  if(S.screen!=='list') return;
  if(S.sheet==='add'||S.sheet==='rename'||S.sheet==='edit'||S.sheet==='confirm'||S.finishing) return;  // si aggiornerà alla chiusura
  if(S.tab==='history' && document.activeElement && document.activeElement.id==='hq'){
    $('#histResults').innerHTML=historyResultsHTML(); wireHistRows(); return;
  }
  renderList();
}
let reloadTimer=null;
function scheduleReload(){
  clearTimeout(reloadTimer);
  reloadTimer=setTimeout(async()=>{ try{ await loadAll(); refreshView(); }catch{} },250);
}
let channel=null;
function startRealtime(){
  if(channel) return;
  channel=db.channel('spesa-famiglia')
    .on('postgres_changes',{event:'*',schema:'public',table:'items'},scheduleReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'trips'},scheduleReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'purchases'},scheduleReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'ratings'},scheduleReload)
    .subscribe();
}
function stopRealtime(){ if(channel){ db.removeChannel(channel); channel=null; } }

// ===== accesso =====
async function afterLogin(user){
  S.me=user.id;
  S.user=(user.email||'').replace(EMAIL_DOMAIN,'');
  const prof=await q(db.from('profiles').select('display_name').eq('id',user.id).maybeSingle());
  if(prof&&prof.display_name){ S.displayName=prof.display_name; await enterList(); }
  else { S.screen='name'; render(); }
}
const LIST_KEY='spesa-lista-scelta';
async function loadLists(){
  S.lists=await q(db.from('lists').select('*').order('sort'));
  let saved=null; try{ saved=localStorage.getItem(LIST_KEY); }catch{}
  const ok=id=>S.lists.some(l=>l.id===id);
  S.listId=ok(S.listId)?S.listId:ok(saved)?saved:(S.lists[0]&&S.lists[0].id)||null;
}
const curList = () => S.lists.find(l=>l.id===S.listId)||{name:'Spesa di Casa'};
async function switchList(id){
  if(id===S.listId){ S.sheet=null; renderList(); return; }
  S.listId=id; try{ localStorage.setItem(LIST_KEY,id); }catch{}
  S.sheet=null; S.q=''; S.items=[]; S.history=[]; S.ratings=[]; S.pending=new Set(); S.pendingVal={};
  renderList();
  try{ await loadAll(); }catch{ toast('Non riesco a caricare la lista. Controlla la connessione.',{bad:true}); }
  renderList();
}
async function enterList(){
  S.screen='list';
  try{ await loadLists(); await loadAll(); }
  catch{ toast('Non riesco a caricare la lista. Controlla la connessione.',{bad:true}); }
  if(S.screen==='list' && !S.lists.length){ $('#app').innerHTML='<div class="gate"><h1>Spesa di Casa</h1><div class="err">Non hai ancora accesso a nessuna lista. Chiedi a Gabriele di controllare il tuo account.</div></div>'; return; }
  render(); startRealtime();
}
async function boot(){
  if(!db){ $('#app').innerHTML='<div class="gate"><h1>Spesa di Casa</h1><div class="err">Non riesco a caricare l’app. Controlla la connessione e ricarica la pagina.</div></div>'; return; }
  try{
    const {data}=await db.auth.getSession();
    if(data&&data.session) { await afterLogin(data.session.user); return; }
  }catch{}
  S.screen='login'; render();
}
db&&db.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ stopRealtime(); S.screen='login'; S.sheet=null; render(); } });

function render(){
  const app=$('#app');
  if(S.screen==='login'){
    app.innerHTML=`
    <form class="gate" id="loginForm" novalidate>
      <div><h1>Spesa di Casa</h1><p style="margin-top:10px">Entra con il nome utente e la password che ti ha dato Gabriele.</p></div>
      <div class="field"><label for="u">Nome utente</label><input id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="es. claudia" value="${esc(S.user)}"></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"></div>
      <div class="err" id="loginErr" hidden></div>
      <button class="primary" id="loginBtn">Entra</button>
    </form>`;
    $('#loginForm').onsubmit=async e=>{
      e.preventDefault();
      const u=norm($('#u').value).replace(/\s/g,'').replace(/@.*$/,''), p=$('#p').value, err=$('#loginErr'), btn=$('#loginBtn');
      if(!u||!p){err.textContent='Scrivi nome utente e password.';err.hidden=false;return}
      btn.disabled=true; btn.textContent='Accesso in corso…'; err.hidden=true;
      try{
        const {data,error}=await db.auth.signInWithPassword({email:u+EMAIL_DOMAIN,password:p});
        if(error) throw error;
        await afterLogin(data.user);
      }catch(ex){
        const bad=ex&&(ex.status===400||/invalid/i.test(ex.message||''));
        err.textContent=bad?'Nome utente o password sbagliati.':'Non riesco a collegarmi. Controlla la connessione e riprova.';
        err.hidden=false; btn.disabled=false; btn.textContent='Entra';
      }
    };
  }
  else if(S.screen==='name'){
    app.innerHTML=`
    <form class="gate" id="nameForm" novalidate>
      <div><h1>Come ti chiami?</h1><p style="margin-top:10px">Il nome comparirà accanto agli articoli che aggiungi. Lo scrivi solo questa volta.</p></div>
      <div class="field"><label for="dn">Il tuo nome</label><input id="dn" autocomplete="given-name" maxlength="20" value="${esc(S.user.charAt(0).toUpperCase()+S.user.slice(1))}"></div>
      <div class="err" id="nameErr" hidden></div>
      <button class="primary" id="nameBtn">Continua</button>
    </form>`;
    $('#nameForm').onsubmit=async e=>{
      e.preventDefault(); const v=$('#dn').value.trim().slice(0,20), err=$('#nameErr'), btn=$('#nameBtn');
      if(!v){err.textContent='Scrivi un nome.';err.hidden=false;return}
      btn.disabled=true; btn.textContent='Salvataggio…';
      try{ await q(db.from('profiles').upsert({id:S.me,display_name:v})); S.displayName=v; await enterList(); }
      catch{ err.textContent=NET_ERR; err.hidden=false; btn.disabled=false; btn.textContent='Continua'; }
    };
  }
  else if(S.screen==='list') renderList();
}

// ===== cronologia =====
function hl(name,qs){
  if(!qs) return esc(name);
  const n=norm(name), i=n.indexOf(qs);
  if(i<0||n.length!==name.trim().replace(/\s+/g,' ').length) return esc(name);
  return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+qs.length))+'</mark>'+esc(name.slice(i+qs.length));
}
function historyResultsHTML(){
  const qs=norm(S.q);
  const trips=[...S.history].sort((a,b)=>b.at-a.at)
    .map(t=>({...t,items:qs&&!norm(t.store).includes(qs)?t.items.filter(i=>norm(i.name).includes(qs)):t.items}))
    .filter(t=>t.items.length);
  if(!S.history.length) return `<div class="empty" style="margin-top:16px">Qui compariranno le spese concluse con <b>SPESA FATTA</b>.</div>`;
  if(!trips.length) return `<div class="empty" style="margin-top:16px">Nessun acquisto passato contiene “${esc(S.q.trim())}”.</div>`;
  const tot=trips.reduce((n,t)=>n+t.items.length,0);
  return (qs?`<div class="section">${tot} ${tot===1?'acquisto trovato':'acquisti trovati'}</div>`:'')+trips.map(t=>`
    <div class="trip-h"><span class="when">${fmtWhen(t.at)}${t.store?`<span class="store"> · ${hl(t.store,qs)}</span>`:''}</span><span class="n">${t.items.length} ${t.items.length===1?'articolo':'articoli'}</span></div>
    <ul>${t.items.map(it=>{ const there=inList(it.name); return `<li class="item">
      <button type="button" class="tap" data-hist="${t.id}|${it.id}" aria-label="Apri ${esc(it.name)}: foto e voto">${thumbHTML(it)}
      <span class="txt"><span class="name">${hl(it.name,qs)}</span><span class="meta"><span class="qty">${fmtQty(it.qty)}${it.unit?' '+esc(it.unit):''}</span> · aggiunto da ${esc(it.by)}${prodInfoHTML(it.name)}</span></span></button>
      <button type="button" class="del ${there?'added':''}" data-rebuy="${t.id}|${it.id}" ${there?'disabled aria-label="Già nella lista da comprare"':`aria-label="Rimetti ${esc(it.name)} nella lista"`}>${there
        ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
        :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'}</button></li>`}).join('')}</ul>`).join('');
}

// ===== acquisto passato: foto, voto, rimetti in lista =====
function findHist(ref){ const k=String(ref), cut=k.lastIndexOf('|'); const tid=k.slice(0,cut), iid=k.slice(cut+1);
  const t=S.history.find(x=>String(x.id)===tid); const it=t&&t.items.find(x=>String(x.id)===iid); return it?{t,it}:null; }
function wireHistRows(){
  $('#app').querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{S.histRef=b.dataset.hist;S.sheet='hist';renderList()});
  $('#app').querySelectorAll('[data-rebuy]').forEach(b=>b.onclick=()=>rebuy(b.dataset.rebuy));
}
function histHTML(){
  const f=findHist(S.histRef); if(!f) return '';
  const {t,it}=f, rows=ratingRows(it.name), mineRow=rows.find(r=>r.user_id===S.me), mine=mineRow?mineRow.stars:0;
  const a=avgVals(rows.map(r=>r.stars)), there=inList(it.name), nb=timesBought(it.name);
  const votes=[...rows].sort((x,y)=>x.user_id===S.me?-1:y.user_id===S.me?1:x.voter_name.localeCompare(y.voter_name));
  return `<div class="scrim" id="scrim"></div>
  <div class="sheet sheet-scroll" role="dialog" aria-label="${esc(it.name)}"><form onsubmit="return false">
    <div><h2 style="overflow-wrap:anywhere">${esc(it.name)}</h2>
      <div class="meta" style="margin-top:4px">${fmtQty(it.qty)}${it.unit?' '+esc(it.unit):''} · aggiunto da ${esc(it.by)} · ${fmtWhen(t.at)}${t.store?' · da '+esc(t.store):''}</div>
      <div class="meta" style="margin-top:2px;color:var(--fg);font-weight:600">${timesTxt(nb).replace('comprato','Comprato')}${nb>1?' · il voto vale per tutti gli acquisti con questo nome':''}</div></div>
    ${it.photo?`<img src="${esc(photoSrc(it.photo))}" alt="" style="width:100%;max-height:34vh;object-fit:contain;border-radius:12px;background:var(--bg)">`:''}
    <div class="field"><span class="label">Il tuo voto${mine?'':' (tocca una stella)'}</span>
      <div class="stars" role="radiogroup" aria-label="Il tuo voto da 1 a 5">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=mine?'on':''}" data-star="${n}" role="radio" aria-checked="${n===mine}" aria-label="${n} ${n===1?'stella':'stelle'}">${STAR}</button>`).join('')}</div>
      ${mine?'<button type="button" class="linkish" id="noVote" style="align-self:flex-start">Togli il mio voto</button>':''}</div>
    ${votes.length?`<div class="field"><span class="label">Voti della famiglia · media <span class="rate">★ ${a.avg.toFixed(1).replace('.',',')}</span></span>
      <ul class="votes">${votes.map(r=>`<li><span>${esc(r.voter_name)}${r.user_id===S.me?' (tu)':''}</span><span class="mini-stars" aria-label="${r.stars} su 5">${miniStars(r.stars)}</span></li>`).join('')}</ul></div>`:''}
    <button type="button" class="menu-btn" id="hName">Modifica nome</button>
    <button type="button" class="menu-btn" id="hPhoto">${it.photo?'Cambia foto':'Aggiungi foto'}</button>
    ${it.photo?'<button type="button" class="menu-btn" id="hNoPhoto">Rimuovi foto</button>':''}
    <button type="button" class="primary" id="hRebuy" ${there?'disabled':''}>${there?'Già nella lista da comprare':'Rimetti nella lista della spesa'}</button>
    <button type="button" class="ghost" id="cancel">Chiudi</button>
  </form></div>`;
}
function wireHist(){
  const ref=S.histRef, close=()=>{S.sheet=null;S.histRef=null;renderList()};
  $('#scrim').onclick=close; $('#cancel').onclick=close;
  $('#app').querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>setRating(ref,+b.dataset.star));
  const nv=$('#noVote'); if(nv) nv.onclick=()=>setRating(ref,0);
  $('#hPhoto').onclick=()=>pickPhoto(d=>setHistPhoto(ref,d));
  const np=$('#hNoPhoto'); if(np) np.onclick=()=>setHistPhoto(ref,null);
  $('#hRebuy').onclick=()=>rebuy(ref);
  $('#hName').onclick=()=>{ S.renameRef={kind:'hist',ref,back:'hist'}; S.sheet='rename'; renderList(); setTimeout(()=>$('#rname')?.focus(),50); };
}
let ratingBusy=false;
async function setRating(ref,n){
  const f=findHist(ref); if(!f||ratingBusy) return;
  ratingBusy=true;
  const key=norm(f.it.name), before=S.ratings;
  S.ratings=S.ratings.filter(r=>!(r.product_key===key&&r.user_id===S.me));
  if(n) S.ratings=[...S.ratings,{product_key:key,user_id:S.me,voter_name:S.displayName,stars:n}];
  renderList();                                   // cambio subito, poi confermo
  try{
    if(n) await q(db.from('ratings').upsert({list_id:S.listId,product_key:key,user_id:S.me,voter_name:S.displayName,stars:n,updated_at:new Date().toISOString()},{onConflict:'list_id,product_key,user_id'}));
    else await q(db.from('ratings').delete().eq('list_id',S.listId).eq('product_key',key).eq('user_id',S.me));
    toast(n?'Voto salvato: '+n+(n===1?' stella':' stelle'):'Voto tolto.');
  }catch{ S.ratings=before; toast(NET_ERR,{bad:true}); }
  ratingBusy=false; renderList();
}
async function setHistPhoto(ref,data){
  const f=findHist(ref); if(!f) return;
  try{
    const path=data?await uploadPhoto(data):null;
    await q(db.from('purchases').update({photo_path:path}).eq('id',f.it.id));
    f.it.photo=path; toast(data?'Foto salvata.':'Foto rimossa.');
  }catch{ toast(NET_ERR,{bad:true}); }
  renderList();
}
const rebuying=new Set();
async function rebuy(ref){
  const f=findHist(ref); if(!f||rebuying.has(ref)) return;
  if(inList(f.it.name)){ toast('“'+f.it.name+'” è già nella lista da comprare.'); return; }
  rebuying.add(ref);                              // blocca il doppio tocco
  try{
    const {name,qty,unit,photo}=f.it;
    const row=await q(db.from('items').insert({list_id:S.listId,name,product_key:norm(name),qty,unit,photo_path:photo||null,by_name:S.displayName}).select().single());
    if(!S.items.some(i=>i.id===row.id)) S.items.push({id:row.id,name,qty,unit,by:S.displayName,done:false,t:Date.parse(row.created_at),photo:photo||null});
    toast('Rimesso in lista: '+name,{action:'Modifica',onAction:()=>{ S.editId=row.id; S.sheet='edit'; renderList(); }});
  }catch{ toast(NET_ERR,{bad:true}); }
  rebuying.delete(ref); renderList();
}

  return `<div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Concludi la spesa"><form id="confirmForm">

    <p class="confirm-list">${done.map(i=>esc(i.name)).join(' · ')}</p>
    <p style="margin:0;color:var(--muted);font-size:14px">Lista ${esc(curList().name)}. Passeranno nella Cronologia. Gli articoli non spuntati restano nella lista.</p>
    <div class="field"><label for="store">Dove hai fatto la spesa? (facoltativo)</label>
      <input id="store" maxlength="60" autocomplete="off" list="storeList" placeholder="es. Esselunga viale Monza" value="${esc(S.lastStore||'')}">
      <datalist id="storeList">${pastStores().map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist></div>
    <button class="primary" id="confirmBtn">Concludi la spesa</button>
    <button type="button" class="ghost" id="cancel">Annulla</button>
  </form></div>`;

// negozi già usati in questa lista, dal più recente
function pastStores(){
  const seen=new Set(), out=[];
  [...S.history].sort((a,b)=>b.at-a.at).forEach(t=>{ const k=norm(t.store); if(t.store&&!seen.has(k)){ seen.add(k); out.push(t.store); } });
  return out.slice(0,8);
}
function wireConfirm(){
  const st=$('#store'); if(st) st.oninput=()=>{ S.lastStore=st.value; };
  const close=()=>{ if(S.finishing) return; S.sheet=null; renderList(); };
  $('#scrim').onclick=close; $('#cancel').onclick=close;
  $('#confirmForm').onsubmit=async e=>{
    e.preventDefault();
    if(S.finishing) return;                       // blocca il doppio tocco
    const ids=S.items.filter(i=>i.done).map(i=>i.id);
    const store=($('#store').value||'').trim().replace(/\s+/g,' ').slice(0,60);
    S.finishing=true; const btn=$('#confirmBtn'); btn.disabled=true; btn.textContent='Salvataggio…';
    try{
      // il database sposta tutto in un'unica operazione: o tutto o niente
      const n=await q(db.rpc('finish_shopping',{p_list:S.listId,p_ids:ids,p_store:store||null}));
      S.finishing=false; S.sheet=null; S.lastStore='';
      await loadAll().catch(()=>{});
      renderList();
      toast(n?'Spesa conclusa: '+n+(n===1?' articolo spostato':' articoli spostati')+' nella Cronologia.':'Il carrello era già vuoto: qualcuno ha già concluso la spesa.');
    }catch{
      S.finishing=false; btn.disabled=false; btn.textContent='Riprova';
      toast('Connessione assente: la spesa non è stata conclusa e la lista non è cambiata. Riprova.',{bad:true});
    }
  };
}

// ===== aggiungi articolo =====
function photoPickHTML(){
  const d=S.draftPhoto, src=d?(d.data||photoSrc(d.path)):'';
  return d
    ? `<img class="thumb" src="${esc(src)}" alt="Foto scelta"><button type="button" class="soft" id="photoBtn">Cambia foto</button><button type="button" class="linkish" id="photoDel">Rimuovi</button>`
    : `<button type="button" class="soft" id="photoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Aggiungi foto</button>`;
}
function sheetHTML(){
  return `<div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Aggiungi articolo">
    <form id="addForm" novalidate>
      <h2>Aggiungi articolo</h2>
      <div class="field"><label for="iname">Cosa serve?</label><input id="iname" placeholder="es. Yogurt bianco" maxlength="60" autocomplete="off"></div>
      <div class="sugg" id="sugg" hidden></div>
      <div class="row">
        <div class="field"><label for="iqty">Quantità</label>
          <div class="stepper"><button type="button" id="minus" aria-label="Meno">−</button><input id="iqty" inputmode="decimal" value="1"><button type="button" id="plus" aria-label="Più">+</button></div></div>
        <div class="field"><label for="iunit">Unità (facoltativa)</label>
          <select id="iunit">${Object.entries(UNITS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      </div>
      <div class="field"><span style="font-weight:600;font-size:14px">Foto (facoltativa)</span><div class="photo-pick" id="photoPick">${photoPickHTML()}</div></div>
      <div class="err" id="addErr" hidden></div>
      <button class="primary" id="saveBtn">Aggiungi alla lista</button>
      <button type="button" class="ghost" id="cancel">Annulla</button>
    </form>
  </div>`;
}
function wirePhotoPick(){
  $('#photoBtn').onclick=()=>pickPhoto(d=>{S.draftPhoto={data:d}; $('#photoPick').innerHTML=photoPickHTML(); wirePhotoPick();});
  const del=$('#photoDel'); if(del) del.onclick=()=>{S.draftPhoto=null; $('#photoPick').innerHTML=photoPickHTML(); wirePhotoPick();};
}
function wireSheet(){
  const qi=$('#iqty'), parse=()=>parseFloat(qi.value.replace(',','.'))||0;
  const close=()=>{S.sheet=null;S.draftPhoto=null;renderList()};
  $('#scrim').onclick=close; $('#cancel').onclick=close;
  $('#minus').onclick=()=>{qi.value=fmtQty(Math.max(1,parse()-1))};
  $('#plus').onclick=()=>{qi.value=fmtQty(parse()+1)};
  wirePhotoPick();
  const sugg=$('#sugg');
  $('#iname').oninput=e=>{
    const k=norm(e.target.value);
    const hits=k.length<2?[]:pastProducts().filter(p=>norm(p.name).includes(k)).slice(0,3);
    sugg.hidden=!hits.length;
    sugg.innerHTML=hits.length?'<span class="label">Già comprati, tocca per riusarli</span>'+hits.map((p,ix)=>`<button type="button" data-sugg="${ix}">${thumbHTML(p)}<span class="txt"><span class="name">${esc(p.name)}</span><span class="meta">ultima volta ${fmtQty(p.qty)}${p.unit?' '+esc(p.unit):''}${prodInfoHTML(p.name)}</span></span></button>`).join(''):'';
    sugg.querySelectorAll('[data-sugg]').forEach(b=>b.onclick=()=>{
      const p=hits[+b.dataset.sugg];
      $('#iname').value=p.name; qi.value=fmtQty(p.qty); $('#iunit').value=p.unit||'';
      S.draftPhoto=p.photo?{path:p.photo}:null; $('#photoPick').innerHTML=photoPickHTML(); wirePhotoPick();
      sugg.hidden=true; sugg.innerHTML='';
    });
  };
  let saving=false;
  $('#addForm').onsubmit=async e=>{
    e.preventDefault(); if(saving) return;
    const name=$('#iname').value.trim().replace(/\s+/g,' '), qty=parse(), unit=$('#iunit').value, err=$('#addErr'), btn=$('#saveBtn');
    if(!name){err.textContent='Scrivi il nome dell’articolo.';err.hidden=false;return}
    if(!(qty>0&&qty<10000)){err.textContent='La quantità deve essere un numero maggiore di zero.';err.hidden=false;return}
    saving=true; btn.disabled=true; btn.textContent='Salvataggio…';
    try{
      const d=S.draftPhoto;
      const path=d?(d.path||await uploadPhoto(d.data)):null;
      const row=await q(db.from('items').insert({list_id:S.listId,name,product_key:norm(name),qty,unit,photo_path:path,by_name:S.displayName}).select().single());
      if(!S.items.some(i=>i.id===row.id)) S.items.push({id:row.id,name,qty,unit,by:S.displayName,done:false,t:Date.parse(row.created_at),photo:path});
      S.sheet=null; S.draftPhoto=null; renderList(); toast('Aggiunto: '+name);
    }catch{
      saving=false; err.textContent=NET_ERR; err.hidden=false; btn.disabled=false; btn.textContent='Riprova';
    }
  };
}

// ===== menu ⋯ della lista =====
function menuHTML(){
  const it=S.items.find(i=>i.id===S.menuId); if(!it) return '';
  return `<div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Azioni per ${esc(it.name)}"><form onsubmit="return false">
    <h2 style="overflow-wrap:anywhere">${esc(it.name)}</h2>
    ${it.photo?`<img src="${esc(photoSrc(it.photo))}" alt="" style="width:100%;max-height:40vh;object-fit:contain;border-radius:12px;background:var(--bg)">`:''}
    <button type="button" class="menu-btn" id="mEdit">Modifica articolo</button>
    <button type="button" class="menu-btn" id="mPhoto">${it.photo?'Cambia foto':'Aggiungi foto'}</button>
    ${it.photo?'<button type="button" class="menu-btn" id="mNoPhoto">Rimuovi foto</button>':''}
    <button type="button" class="menu-btn danger" id="mDel">Elimina articolo</button>
    <button type="button" class="ghost" id="cancel">Annulla</button>
  </form></div>`;
}
function wireMenu(){
  const id=S.menuId, close=()=>{S.sheet=null;S.menuId=null;renderList()};
  $('#scrim').onclick=close; $('#cancel').onclick=close;
  $('#mPhoto').onclick=()=>pickPhoto(d=>setPhoto(id,d));
  const np=$('#mNoPhoto'); if(np) np.onclick=()=>setPhoto(id,null);
  $('#mDel').onclick=()=>{ S.sheet=null; S.menuId=null; del(id); };
  $('#mEdit').onclick=()=>{ S.editId=id; S.sheet='edit'; renderList(); };
}

// ---- modifica articolo della lista: nome, quantità, unità ----
function editHTML(){
  const it=S.items.find(i=>i.id===S.editId); if(!it) return '';
  return `<div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Modifica articolo"><form id="editForm" novalidate>
    <h2>Modifica articolo</h2>
    <div class="field"><label for="ename">Nome</label><input id="ename" maxlength="60" autocomplete="off" value="${esc(it.name)}"></div>
    <div class="row">
      <div class="field"><label for="eqty">Quantità</label>
        <div class="stepper"><button type="button" id="eminus" aria-label="Meno">−</button><input id="eqty" inputmode="decimal" value="${fmtQty(it.qty)}"><button type="button" id="eplus" aria-label="Più">+</button></div></div>
      <div class="field"><label for="eunit">Unità (facoltativa)</label>
        <select id="eunit">${Object.entries(UNITS).map(([k,v])=>`<option value="${k}" ${k===(it.unit||'')?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="err" id="editErr" hidden></div>
    <button class="primary" id="editBtn">Salva modifiche</button>
    <button type="button" class="ghost" id="cancel">Annulla</button>
  </form></div>`;
}
function wireEdit(){
  const id=S.editId, close=()=>{ S.sheet=null; S.editId=null; renderList(); };
  $('#scrim').onclick=close; $('#cancel').onclick=close;
  const qi=$('#eqty'), parse=()=>parseFloat(qi.value.replace(',','.'))||0;
  $('#eminus').onclick=()=>{ qi.value=fmtQty(Math.max(1,parse()-1)); };
  $('#eplus').onclick=()=>{ qi.value=fmtQty(parse()+1); };
  let saving=false;
  $('#editForm').onsubmit=async e=>{
    e.preventDefault(); if(saving) return;
    const it=S.items.find(i=>i.id===id); if(!it) return close();
    const name=$('#ename').value.trim().replace(/\s+/g,' '), qty=parse(), unit=$('#eunit').value, err=$('#editErr'), btn=$('#editBtn');
    if(!name){ err.textContent='Scrivi il nome dell’articolo.'; err.hidden=false; return; }
    if(!(qty>0&&qty<10000)){ err.textContent='La quantità deve essere un numero maggiore di zero.'; err.hidden=false; return; }
    if(name===it.name&&qty===it.qty&&unit===(it.unit||'')) return close();
    saving=true; btn.disabled=true; btn.textContent='Salvataggio…';
    try{
      await q(db.from('items').update({name,product_key:norm(name),qty,unit}).eq('id',id));
      Object.assign(it,{name,qty,unit});
      S.sheet=null; S.editId=null; renderList(); toast('Modificato: '+name);
    }catch{
      saving=false; err.textContent=NET_ERR; err.hidden=false; btn.disabled=false; btn.textContent='Riprova';
    }
  };
}
async function setPhoto(id,data){
  const it=S.items.find(i=>i.id===id); if(!it) return;
  try{
    const path=data?await uploadPhoto(data):null;
    await q(db.from('items').update({photo_path:path}).eq('id',id));
    it.photo=path; S.sheet=null; S.menuId=null; toast(data?'Foto salvata.':'Foto rimossa.');
  }catch{ toast(NET_ERR,{bad:true}); }
  renderList();
}

// ===== modifica nome =====
function renameTarget(){
  const r=S.renameRef; if(!r) return null;
  if(r.kind==='item'){ const it=S.items.find(i=>i.id===r.id); return it?{it}:null; }
  return findHist(r.ref);
}
function renameHTML(){
  const f=renameTarget(); if(!f) return '';
  const r=S.renameRef, nb=r.kind==='hist'?timesBought(f.it.name):0;
  return `<div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Modifica nome"><form id="renameForm" novalidate>
    <h2>Modifica nome</h2>
    <div class="field"><label for="rname">Nome dell’articolo</label><input id="rname" maxlength="60" autocomplete="off" value="${esc(f.it.name)}"></div>
    ${nb>1?`<label style="display:flex;gap:12px;align-items:flex-start;font-size:15px"><input type="checkbox" id="rall" checked style="width:22px;height:22px;margin:0;flex:none;accent-color:var(--accent)">
      <span>Cambia il nome in tutti i ${nb} acquisti di questo prodotto<br><span class="meta">Se lo togli, cambia solo questo acquisto e diventa un prodotto a parte.</span></span></label>`:''}
    <p class="meta" style="margin:0">I voti seguono il nome: se il nuovo nome esiste già, i voti dei due prodotti si uniscono.</p>
    <div class="err" id="renErr" hidden></div>
    <button class="primary" id="renBtn">Salva nome</button>
    <button type="button" class="ghost" id="cancel">Annulla</button>
  </form></div>`;
}
function wireRename(){
  const r=S.renameRef;
  const back=()=>{ S.sheet=r.back; S.renameRef=null; renderList(); };
  $('#scrim').onclick=back; $('#cancel').onclick=back;
  let saving=false;
  $('#renameForm').onsubmit=async e=>{
    e.preventDefault(); if(saving) return;
    const f=renameTarget(); if(!f) return back();
    const name=$('#rname').value.trim().replace(/\s+/g,' '), err=$('#renErr'), btn=$('#renBtn');
    if(!name){ err.textContent='Scrivi un nome.'; err.hidden=false; return; }
    if(name===f.it.name){ return back(); }
    const all=r.kind==='hist' && (!$('#rall') || $('#rall').checked);
    saving=true; btn.disabled=true; btn.textContent='Salvataggio…';
    try{
      if(r.kind==='item'){
        await q(db.from('items').update({name,product_key:norm(name)}).eq('id',f.it.id));
        f.it.name=name;
      } else {
        await q(db.rpc('rename_purchases',{p_list:S.listId,p_old_key:norm(f.it.name),p_new_name:name,p_new_key:norm(name),p_only_id:all?null:f.it.id}));
        await loadAll().catch(()=>{});
      }
      S.sheet=r.back; S.renameRef=null; renderList(); toast('Nome cambiato: '+name);
    }catch{
      saving=false; err.textContent=NET_ERR; err.hidden=false; btn.disabled=false; btn.textContent='Riprova';
    }
  };
}

// ===== spunta ed elimina =====
async function toggle(id){
  const it=S.items.find(i=>i.id===id); if(!it||S.pending.has(id)||S.finishing) return;
  const before=it.done; it.done=!before; S.pending.add(id); S.pendingVal[id]=it.done; renderList();   // cambio subito, poi confermo
  try{ await q(db.from('items').update({done:it.done}).eq('id',id)); }
  catch{ it.done=before; toast(NET_ERR,{bad:true}); }
  S.pending.delete(id); delete S.pendingVal[id]; refreshView();
}
async function del(id){
  const idx=S.items.findIndex(i=>i.id===id); if(idx<0) return;
  const [it]=S.items.splice(idx,1); const listAtDelete=S.listId; renderList();
  try{
    await q(db.from('items').delete().eq('id',id));
    toast('Eliminato: '+it.name,{action:'Annulla',onAction:async()=>{
      try{
        const row=await q(db.from('items').insert({list_id:listAtDelete,name:it.name,product_key:norm(it.name),qty:it.qty,unit:it.unit,done:it.done,photo_path:it.photo,by_name:it.by}).select().single());
        if(S.listId===listAtDelete && !S.items.some(i=>i.id===row.id)) S.items.push({...it,id:row.id});
        refreshView();
      }catch{ toast(NET_ERR,{bad:true}); }
    }});
  }catch{ S.items.splice(idx,0,it); renderList(); toast(NET_ERR,{bad:true}); }
}

boot();
</script>
